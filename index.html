<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080b0c">
  <meta name="robots" content="noindex">
  <title>Bülow & Dolz</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/app-icons/favicon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Bülow &amp; Dolz">
  <style>
    :root { color-scheme: dark; --bg: #080b0c; --ink: #f3f5f5; --muted: #9aa4a6; --accent: #e2ef39; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-align: center; }
    main { max-width: 440px; display: grid; justify-items: center; gap: 14px; }
    img { width: min(260px, 70vw); height: auto; margin: -18% 0 -16%; }
    h1 { margin: 6px 0 0; font-size: 22px; font-weight: 700; }
    p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.5; }
    .lang { margin-top: 18px; font-size: 13px; }
    .bar { width: 48px; height: 3px; border-radius: 3px; background: var(--accent); }
  </style>
</head>
<body>
  <main>
    <img src="logo.webp" width="560" height="560" alt="Bülow &amp; Dolz – Elektrotechnik">
    <span class="bar" aria-hidden="true"></span>
    <h1>Interne Plattform</h1>
    <p>Die Arbeitsplattform von Bülow &amp; Dolz ist nur für Mitarbeitende über das Firmennetz erreichbar.</p>
    <p class="lang" lang="en">Internal platform of Bülow &amp; Dolz. Access for staff only via the company network.</p>
  </main>
</body>
</html>
